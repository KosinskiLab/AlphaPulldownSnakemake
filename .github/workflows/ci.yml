name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        # common.smk imports parse_fold_chains from the parser package; >=0.5.1
        # is required (public helper + ".json" preservation for AF3 inputs, #41).
        run: |
          pip install --quiet "alphapulldown-input-parser>=0.5.1" pytest pyyaml
          # Current Snakemake requires Python >=3.11. The 3.10 job still runs all
          # pure-Python adapter/resource tests; 3.12 additionally runs real DAGs.
          if [[ "${{ matrix.python-version }}" == "3.12" ]]; then
            pip install --quiet "snakemake>=9,<10"
          fi
      - name: Byte-compile common.smk
        # common.smk carries the memory/length logic; delegates parsing to the parser.
        run: python -m py_compile workflow/rules/common.smk
      - name: Run workflow tests and dry-runs
        # Includes AF2/AF3 DAG dry-runs and MMseqs GPU shard/retry contracts. The
        # optional SLURM-plugin integration test self-skips when unavailable.
        run: python -m pytest -q test


  inference-flag-tables:
    # The flag tables in common.smk are generated from AlphaPulldown; regenerate them
    # from the commit they record and fail on any difference. Never skips: a source that
    # cannot be read fails the job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read the AlphaPulldown commit the tables record
        id: recorded
        run: echo "commit=$(python tools/generate_inference_flag_tables.py --print-recorded-commit)" >> "$GITHUB_OUTPUT"
      - name: Check out that AlphaPulldown commit
        uses: actions/checkout@v4
        with:
          repository: KosinskiLab/AlphaPulldown
          ref: ${{ steps.recorded.outputs.commit }}
          path: alphapulldown-source
          submodules: false
      - name: Regenerate and compare
        run: python tools/generate_inference_flag_tables.py --source-checkout alphapulldown-source --check
