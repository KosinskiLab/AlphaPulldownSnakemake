name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        # common.smk imports parse_fold_chains from the parser package; >=0.5.1
        # is required (public helper + ".json" preservation for AF3 inputs, #41).
        run: pip install --quiet pytest "alphapulldown-input-parser>=0.5.1"
      - name: Byte-compile common.smk
        # common.smk carries the memory/length logic; delegates parsing to the parser.
        run: python -m py_compile workflow/rules/common.smk
      - name: Run complete unit test suite
        # Tests load common.smk directly; the SLURM-plugin integration test
        # self-skips when the plugin is absent.
        run: python -m pytest test/ -q

  resident-batch-dry-runs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install workflow dependencies
        run: pip install --quiet "snakemake==9.*" "alphapulldown-input-parser>=0.5.1"
      - name: Dry-run resident AlphaFold 2 and AlphaFold 3 batches
        shell: bash
        run: |
          set -euo pipefail
          for backend in af2 af3; do
            log="${RUNNER_TEMP}/resident-${backend}.log"
            snakemake \
              --snakefile workflow/Snakefile \
              --configfile "test/fixtures/resident_batch/${backend}.yaml" \
              --cores 1 \
              --dry-run \
              --printshellcmds | tee "${log}"
            grep -q "run_structure_prediction_batch.py" "${log}"
            grep -Eq '\.prediction_batches/batch-[0-9a-f]{64}\.jsonl' "${log}"
            grep -Eq '/predictions/batch-[0-9a-f]{64}/completed_fold\.txt' "${log}"
          done
      - name: Reject stale batch artifacts after composition changes
        shell: bash
        run: |
          set -euo pipefail
          output="test/fixtures/resident_batch/output-af2"
          old_id=$(grep -m1 -Eo 'batch-[0-9a-f]{64}' \
            "${RUNNER_TEMP}/resident-af2.log")
          mkdir -p "${output}/.prediction_batches" "${output}/predictions/${old_id}"
          touch "${output}/.prediction_batches/${old_id}.jsonl"
          touch "${output}/predictions/${old_id}/completed_fold.txt"

          log="${RUNNER_TEMP}/resident-af2-changed.log"
          snakemake \
            --snakefile workflow/Snakefile \
            --configfile test/fixtures/resident_batch/af2.yaml \
            --config input_files=test/fixtures/resident_batch/changed_sample_sheet.csv \
            --rerun-triggers mtime \
            --cores 1 \
            --dry-run \
            --printshellcmds | tee "${log}"

          grep -q "rule structure_inference" "${log}"
          grep -Eq '/predictions/batch-[0-9a-f]{64}/completed_fold\.txt' "${log}"
          if grep -q "/predictions/${old_id}/completed_fold.txt" "${log}"; then
            echo "changed composition reused the stale batch sentinel" >&2
            exit 1
          fi
