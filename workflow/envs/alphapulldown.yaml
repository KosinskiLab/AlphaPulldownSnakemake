name: snake
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.12
  - snakemake=9.*
  - snakemake-executor-plugin-slurm
  - snakedeploy
  - pulp
  - click
  - coincbc
  - pip
  - pip:
      # >=0.5.0 exposes the public parse_fold_chains() used by the length-aware
      # memory model and the length filter at workflow-parse time.
      - alphapulldown-input-parser>=0.5.0
