# AlphaPulldownSnakemake configuration.
#
# Three sections: REQUIRED (set these), COMMON (routinely adjusted), ADVANCED
# (sensible defaults; change only when you need to). Every key is documented in
# README.md -- the section named beside each key below.

################################################################################
##  REQUIRED  --  a first run needs only this section
################################################################################

# Sample sheets listing the folds to predict. README: "Configure input files"
input_files:
  - config/sample_sheet.csv

# Where all output is written. README: "Setup protein folding jobs"
output_directory: ./temp_fold/

# AlphaFold sequence/template databases, and the model weights for the backend
# you selected below. README: "Database configuration"
databases_directory: /scratch/AlphaFold_DBs/3.0.0
backend_weights_directory : /g/kosinski/dima/alphafold3_weights/

# The container decides the folding backend (alphafold2 / alphafold3 / alphalink);
# a local .sif path also works. README: "Changing folding backends"
prediction_container: "docker://kosinskilab/alphafold3:2.7.0"

################################################################################
##  COMMON  --  what most runs adjust
################################################################################

# Directories of precomputed features to reuse. README: "Using precomputed features"
feature_directory:
  - "/g/alphafold/input_features/Homo_sapiens/features"

# Separator between chains in a fold spec, and whether AB and BA are treated as
# one fold. README: "Setup pulldown experiments"
protein_delimiter: "+"
exclude_permutations: true

# Stop after feature generation instead of predicting. README: "Execution"
only_generate_features: false

# Feature generation flags. README: "Feature generation flags"
create_feature_arguments:
  --save_msa_files: false  # Do not save multiple sequence alignment (MSA) files
  --use_precomputed_msas: true  # Use precomputed MSA files if available
  --max_template_date: "2050-01-01"  # Quote it: unquoted YAML parses as a date object that is not JSON serializable
  # Compress generated features (AF2 -> *.pkl.xz, AF3 -> *_af3_input.json.xz).
  # AF3 compression needs a prediction_container with alphapulldown-input-parser
  # >= 0.5.2; older images index only *.json and fail inference with
  # "['<ID>_af3_input.json'] not found in [...]".
  --compress_features: true
  --data_pipeline: alphafold3 # alphafold2 or alphafold3 data pipeline

# Inference flags. Must match the backend in prediction_container.
# README: "Backend-specific flags"
structure_inference_arguments:
  --fold_backend: alphafold3 # Options: alphafold2, alphafold3, alphalink

# Per-fold analysis and the aggregated report across all folds.
# README: "Structure analysis & reporting"
enable_structure_analysis: true
generate_recursive_report: true
analyze_structure_arguments:
  --contact_thresh: 8.0
  --pae_filter: 100.0
  --models_to_analyse: "all"

# Local MMseqs2 MSA backend for AlphaFold 3 protein features, replacing the
# per-protein jackhmmer/HHblits rules. Off by default. When enabled, every database
# path and build identifier is explicit because the workflow does not guess database
# locations, and the databases must be GPU-padded (makepaddedseqdb) for either search
# mode. Search runs as sharded GPU or CPU jobs; template finalization runs separately
# on CPU. README: "Local MMseqs2 features".
mmseqs2_features:
  # OFF by default. MSA depth from this backend has not been shown equivalent to the
  # native jackhmmer pipeline - measured recall against it was 90% overall but 54-68%
  # on the shallowest families - so treat it as opt-in until you have benchmarked it
  # for your own targets. README: "Local MMseqs2 features".
  enabled: false
  # WHICH SEARCH RUNS. true: MMseqs2 on a GPU, one GPU per search shard, on
  # slurm_partition. false: the same search on CPU, no GPU requested, on
  # slurm_partition_cpu. Either way the databases must be GPU-padded
  # (makepaddedseqdb).
  use_gpu: true

# Arguments for structure inference
  # Databases, shard limits and the resource model are in ADVANCED below.

# Group several folds into ONE inference job to amortise queue wait and model
# loading. 1 = one job per fold (unchanged behaviour). batch_max_tokens caps the
# summed residues per batch; 0 = no cap. README: "Batching small jobs into one SLURM job"
batch_size: 1
batch_max_tokens: 0

# Partition(s) for the GPU inference jobs: one name, comma-separated, or a YAML
# list. README: "SLURM defaults for structure inference"
slurm_partition: "gpu-el8"
slurm_qos: "normal"
alphafold_inference_threads: 8

# alphajudge publishes only ":latest".
analysis_container: "docker://kosinskilab/alphajudge:latest"

################################################################################
##  ADVANCED  --  sensible defaults; change only when you need to
################################################################################

## -- Memory sizing -----------------------------------------------------------
# Host RAM is estimated from sequence length per backend and escalates on OOM
# retries. Values are MEGABYTES. Uncomment a base/per-length key to override the
# backend default for ALL backends. README: "SLURM defaults for structure inference"
mem_safety_factor: 1.25                  # margin on the first-attempt estimate
max_mem_mb: 0                            # hard ceiling per request; 0 = none
feature_create_ram_scaling: 1.1          # per-retry escalation on OOM
structure_inference_ram_scaling: 1.1     # per-retry escalation on OOM
# feature_create_ram_bytes: 64000
# feature_create_ram_per_residue_mb: 120
# structure_inference_ram_bytes: 16000
# structure_inference_ram_per_token_sq_mb: 0.0045
# structure_inference_runtime_minutes: 1440

## -- Length filtering --------------------------------------------------------
# Skip folds too large to be worth submitting; 0 disables a limit. Skipped folds
# are listed in <output_directory>/skipped_folds.tsv.
max_total_length_alphafold2: 5000
max_total_length_alphafold3: 7000
# max_total_length: 6000                 # single override for both backends
max_protein_length: 0                    # drops every fold containing the protein
length_filter_fetch_uniprot: true        # false for fully offline runs

## -- GPU selection -----------------------------------------------------------
# gpu_model pins one card type; gpu_tiers routes by VRAM and OVERRIDES it.
# README: "GPU compatibility"
structure_inference_gpus_per_task: 1
structure_inference_gpu_model: ""
# structure_inference_gpu_vram_headroom: 1.0
# structure_inference_gpu_tiers:
#   - {min_vram_gb: 24, nodes: "gpu21,gpu22,gpu29"}
#   - {min_vram_gb: 80, nodes: "gpu38,gpu39"}
# slurm_exclude_nodes: ""                # nodes to keep inference off

## -- Inference runtime and memory spilling -----------------------------------
# Cap wall time so retry scaling cannot exceed the partition MaxTime. Unified
# memory lets large complexes spill from VRAM into host RAM instead of OOM-ing.
structure_inference_max_runtime: 10080
structure_inference_unified_memory: true
structure_inference_xla_mem_fraction: auto   # "auto", or a number to pin it

## -- CPU partitions ----------------------------------------------------------
# Feature jobs are numerous and memory-hungry; listing several partitions raises
# concurrency substantially. Unset = cluster default.
# slurm_partition_cpu: "htc-el8,htc-el10,bigmem"

## -- Local MMseqs2 features -------------------------------------------------
# Read only when mmseqs2_features.enabled is true; uncomment these under
# mmseqs2_features: in the COMMON section.
#  binary_path: /opt/mmseqs/bin/mmseqs  # only supported path; bundled in the image
#  binary_id: 8cc5ce367b5638c4306c2d7cfc652dd099a4643f  # update with image
#  temp_dir: /local-fast-scratch/mmseqs
#  # Queries per shard. Cost is the database scan, not the queries: 1 and 128 queries
#  # took 65 and 66 minutes and the same memory, so larger shards are close to free.
#  batch_max_sequences: 256
#  batch_max_residues: 100000
#  e_value: 0.0001
#  # Search memory is DERIVED from the largest configured database, because the
#  # databases are searched one after another rather than together, and it does not
#  # depend on shard size or query length. search_ram_mb is only the fallback used
#  # when the database paths cannot be read at parse time.
#  search_ram_mb: 160000
#  # MMseqs2 touches the whole target database into RSS unless db_load_mode is 2,
#  # which lowers memory but is not the default -- try it on your own data.
#  db_load_mode: 2
#  gpu_ram_scaling: 1.1
#  search_runtime_base_minutes: 90
#  cpu_runtime_multiplier: 2.5          # walltime allowance for CPU vs GPU search
#  gpu_runtime_per_sequence_minutes: 0.5
#  gpu_runtime_per_1000_residues: 1.0
#  # Finalization stage (CPU): AF3 template search over an MSA that already exists.
#  # Measured 0.24 GB / 13 s for one protein, 0.57 GB / 110 s for eight.
#  finalize_base_ram_mb: 2000
#  finalize_ram_per_residue_mb: 1.0
#  finalize_runtime_minutes_base: 30
#  template_database_ids:  # immutable identities for native AF3 template cache
#    pdb_seqres: pdb-seqres-2026-08
#    mmcif: pdb-mmcif-2026-08
#  # GPU-padded MMseqs2 databases built from the AlphaFold 3.0.0 FASTAs. The paths
#  # below are the shared EMBL build - uncomment as-is there, or repoint elsewhere.
#  databases:
#    uniref90: {path: /g/alphafold/AlphaFold_DBs/mmseqs/uniref90_gpu, identifier: uniref90-2022_05-padded, max_sequences: 10000}
#    mgnify: {path: /g/alphafold/AlphaFold_DBs/mmseqs/mgnify_gpu, identifier: mgy_clusters-2022_05-padded, max_sequences: 5000}
#    small_bfd: {path: /g/alphafold/AlphaFold_DBs/mmseqs/small_bfd_gpu, identifier: small-bfd-padded, max_sequences: 5000}
#    uniprot: {path: /g/alphafold/AlphaFold_DBs/mmseqs/uniprot_gpu, identifier: uniprot_all-2021_04-padded, max_sequences: 50000}

## -- Extra report flags ------------------------------------------------------
# --aggregate_report also produces an RCSB-style validation PDF (absolute path).
recursive_report_arguments: {}
# recursive_report_arguments:
#   --aggregate_report: /absolute/path/to/reports/aggregate_report.pdf
