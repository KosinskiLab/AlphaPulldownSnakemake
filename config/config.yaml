# List of input sample sheets
input_files:
  - config/sample_sheet.csv

# Delimiter used in protein names
protein_delimiter: "+"

# Whether to drop equivalent permutations (AB and BA are the same) when generating fold specs
exclude_permutations: true

# Directory where all output files will be stored
output_directory: ./temp_fold/

# Path to AlphaFold databases and to backend weights
# Note prior to version 2.0.4 these were called alphafold_data_directory
databases_directory: /scratch/AlphaFold_DBs/3.0.0
backend_weights_directory : /g/kosinski/dima/alphafold3_weights/

# Directories containing precomputed features
feature_directory:
  - "/g/alphafold/input_features/Homo_sapiens/features"

# If True, only generate features without running structure prediction
only_generate_features: false

# Toggle structure analysis after prediction
enable_structure_analysis: true

# Generate an aggregated CSV (reports/all_interfaces.csv) across all folds
generate_recursive_report: true

# Extra CLI flags to pass to alphajudge during recursive report generation.
# Uncomment --aggregate_report to also produce an RCSB-style validation PDF
# alongside the all_interfaces.csv (one slider page per detected interface,
# ranked by interface_meta_score against the AlphaJudge benchmark). The path
# must be absolute (or relative to the working directory snakemake uses).
recursive_report_arguments: {}
# recursive_report_arguments:
#   --aggregate_report: /absolute/path/to/reports/aggregate_report.pdf

# Arguments for feature generation
create_feature_arguments:
  --save_msa_files: false  # Do not save multiple sequence alignment (MSA) files
  --use_precomputed_msas: true  # Use precomputed MSA files if available
  --max_template_date: "2050-01-01"  # Set maximum template date (quote it: unquoted YAML parses as a date object that is not JSON serializable)
  --compress_features: true  # Compress generated features
  --data_pipeline: alphafold3 # Use alphafold2 or alphafold3 data pipeline for generating features

# Optional local MMseqs2-GPU MSA backend for AlphaFold 3 protein features. The
# default false leaves the existing one-protein feature rules unchanged. When
# enabled, every database path and immutable build identifier is required; the
# workflow deliberately does not guess database locations. Prediction images
# bundle MMseqs2-GPU at /opt/mmseqs/bin/mmseqs. Database prefixes must reference
# GPU-compatible MMseqs2 databases padded for GPU search. GPU MSA shards release
# their GPU before independent CPU template/finalization jobs begin.
mmseqs2_gpu_features:
  enabled: false
#  binary_path: /opt/mmseqs/bin/mmseqs  # only supported path; bundled in the image
#  binary_id: 8cc5ce367b5638c4306c2d7cfc652dd099a4643f  # update with image
#  temp_dir: /local-fast-scratch/mmseqs
#  batch_max_sequences: 256  # maximum queries in one GPU shard / core batch
#  batch_max_residues: 100000
#  e_value: 0.0001
#  # Host-RAM and time model for one GPU shard. gpu_database_ram_mb should cover
#  # the largest padded target database plus MMseqs overhead on your system.
#  gpu_database_ram_mb: 64000
#  gpu_chunk_ram_per_residue_mb: 0.02
#  gpu_ram_scaling: 1.1
#  gpu_runtime_base_minutes: 15
#  gpu_runtime_per_sequence_minutes: 0.5
#  gpu_runtime_per_1000_residues: 1.0
#  template_database_ids:  # immutable identities for native AF3 template cache
#    pdb_seqres: pdb-seqres-2026-08
#    mmcif: pdb-mmcif-2026-08
#  databases:
#    uniref90: {path: /db/mmseqs/uniref90, identifier: uniref90-2026-08, max_sequences: 10000}
#    mgnify: {path: /db/mmseqs/mgnify, identifier: mgnify-2026-08, max_sequences: 5000}
#    small_bfd: {path: /db/mmseqs/small_bfd, identifier: small-bfd-2026-08, max_sequences: 5000}
#    uniprot: {path: /db/mmseqs/uniprot, identifier: uniprot-2026-08, max_sequences: 50000}

# Arguments for structure inference
structure_inference_arguments:
  --fold_backend: alphafold3 # Options: alphafold2, alphafold3, alphalink

# Arguments for structure analysis.
# Per-fold alphajudge runs automatically write a per-run RCSB-style report.pdf
# next to interfaces.csv (the --report flag is on by default when no --summary
# is requested at this stage).
analyze_structure_arguments:
  --contact_thresh: 8.0 # Contact threshold for structure analysis
  --pae_filter: 100.0 # PAE filter for structure analysis
  --models_to_analyse: "all"  # Models to analyze

# Memory allocation for feature creation and structure inference.
# NOTE: despite the "_bytes" suffix these values are in MEGABYTES (used directly as
# the SLURM --mem request), so 64000 = 64000 MB ~= 64 GB.
#
# Host RAM for both stages is sized automatically from the input sequence length
# with a safety margin, and still escalates on OOM retries. The requested memory is:
#   create_features      : safety * (feature_create_ram_bytes + per_residue * seq_len)
#   structure_inference  : safety * (structure_inference_ram_bytes + per_token_sq * N^2)
# where seq_len is the query length, N is the total residues of the complex, and the
# request is multiplied by (scaling ** (attempt - 1)) on each retry. AlphaFold's pair
# representation is O(N^2), hence the quadratic term for inference.
#
# The base / per-length coefficients DEFAULT BY BACKEND (AF2 is heavier than AF3),
# selected automatically from --data_pipeline / --fold_backend:
#                              feature base   feature /res   infer base   infer /N^2
#   alphafold2 (AF2 multimer):    64000 MB      120 MB         16000 MB     0.0055
#   alphafold3 (AF3):             24000 MB        8 MB          8000 MB     0.0045
# Inference bases are deliberately modest; the quadratic term dominates at high N, and
# OOM retries still escalate from this base via `..._ram_scaling ** (attempt - 1)`.
# Leave the keys below commented to use those backend defaults. Uncomment any key
# to override it for ALL backends.

# Safety margin applied to the first-attempt estimate of every length-aware stage.
mem_safety_factor: 1.25
# Optional hard ceiling (MB) on any single memory request; 0 = no cap. Set this to
# your largest node's RAM on clusters where an over-estimate would never schedule.
max_mem_mb: 0

# create_features (CPU/MSA) — base is database/MSA-tool dominated (AF2 HHblits is the
# main OOM source), with a mild linear dependence on query length.
# feature_create_ram_bytes: 64000        # MB, fixed base (default: backend-specific)
# feature_create_ram_per_residue_mb: 120 # MB per query residue (default: backend-specific)
feature_create_ram_scaling: 1.1          # per-retry escalation on OOM
# The AF2 figures above are fitted to 2,825 measured first attempts (99-2261 aa): they
# cover 98.8% of jobs outright, and the 1.1 escalation covers the rest within the 3
# retries set in config/profiles/slurm/config.yaml. Retries must stay enabled for that
# tail to be caught - with retries off, an OOM is a permanent loss.

# structure_inference (GPU host RAM) — base plus a quadratic term in complex size.
# With unified memory enabled the XLA spill fraction is derived from this host
# allocation, so this also sizes the effective GPU memory ceiling.
# structure_inference_ram_bytes: 16000           # MB, fixed base (default: backend-specific)
# structure_inference_ram_per_token_sq_mb: 0.0045  # MB per residue^2 (default: backend-specific)
structure_inference_ram_scaling: 1.1             # per-retry escalation on OOM
# Wall-time minutes per attempt for structure_inference (capped by
# structure_inference_max_runtime). Default 1440; AF3 on an adequate GPU finishes far
# sooner, but host-memory spilling can take many hours, so the default stays generous.
# structure_inference_runtime_minutes: 1440

# Length filtering: skip folds that are too large to be worth submitting. Lengths
# are resolved at parse time (local FASTA / already-downloaded data / cache / the
# UniProt REST API) and cached in <output_directory>/.sequence_lengths.tsv; skipped
# folds are listed in <output_directory>/skipped_folds.tsv. Unknown lengths fail
# open (the fold is kept). Set a limit to 0 to disable it.
#
# Max TOTAL complex length (sum of all chains, residues), per backend; selected by
# --fold_backend. AF3 handles larger inputs than AF2-Multimer.
max_total_length_alphafold2: 5000
max_total_length_alphafold3: 7000
# Optional single override applied to BOTH backends (takes precedence if set):
# max_total_length: 6000
# Max length of any SINGLE protein (residues); 0 disables (issue #33). A protein
# over this drops every fold containing it, so it is never downloaded/predicted.
max_protein_length: 0
# Whether parse-time length resolution may query the UniProt REST API for IDs that
# have no local FASTA / cached length yet. Set false for fully offline runs.
length_filter_fetch_uniprot: true

# Small-job batching (issue #48): group several folds into ONE structure_inference
# Slurm job to amortise queue wait and per-job model loading. The job runs
# run_structure_prediction.py once over the whole batch (model loaded once, folds
# predicted back to back). Folds are grouped by size so a batch's memory tracks its
# largest fold and its walltime the number of folds. batch_size is the max folds per
# job (1 = today's one-job-per-fold behaviour, fully unchanged). batch_max_tokens
# optionally caps the summed residues per batch so total walltime stays within the
# partition MaxTime; 0 disables that cap (a single oversized fold always runs alone).
# Trade-off: a failed batch reruns all its folds, so keep batches modest; folds whose
# outputs already exist are skipped on rerun when the backend supports resuming.
batch_size: 1
batch_max_tokens: 0

# Number of threads for AlphaFold inference
alphafold_inference_threads: 8

# SLURM resources
# Partition(s) for the GPU structure_inference jobs. Give ONE partition, or SEVERAL
# to let SLURM start each job on whichever one frees up first (it schedules onto the
# soonest-available partition). Accepts a single name, a comma/space-separated string,
# or a YAML list -- all equivalent:
#   slurm_partition: "gpu-el8"                     # single partition
#   slurm_partition: "gpu-el8,gpu-training"        # comma-separated
#   slurm_partition:                               # YAML list
#     - gpu-el8
#     - gpu-training
# SLURM runs the job on the first listed partition that fits its GPUs, --mem and
# walltime and skips those that don't (e.g. a MaxTime below structure_inference_max_runtime,
# or no matching GPU), so make sure at least one listed partition can accommodate it.
# Structure inference and MMseqs2-GPU MSA shards use this; template/finalization
# and the other CPU feature rules use slurm_partition_cpu.
slurm_partition: "gpu-el8"

# Partition(s) for the CPU rules (feature generation). Same syntax as above: one
# name, a comma-separated string, or a YAML list. Leave unset to use the cluster
# default partition (previous behaviour).
#
# Worth setting on a busy cluster. Feature jobs are numerous and memory-hungry
# (~100-200 GB each), so confining them to a single partition caps how many can run
# at once no matter what --jobs says: at EMBL, moving from one partition to five
# took concurrency from 18 to ~195 with nothing left pending. List only partitions
# whose nodes have enough RAM for your longest query, and prefer CPU-only ones so
# GPU nodes stay free for jobs that need them.
#
# EMBL example (CPU-only partitions, 251 GB - 12 TB per node):
# slurm_partition_cpu: "htc-el8,htc-el10,bigmem,bigmem-el10"
slurm_qos: "normal"
structure_inference_gpus_per_task: 1
# Restrict structure_inference to one GPU model (sbatch --gpus=<model>:N), e.g. "3090".
# Default "" lets SLURM pick any GPU in the partition (use the whole pool); set a model
# name only if you want to pin all inference jobs to one card type. The richer
# structure_inference_gpu_tiers below routes by VRAM and OVERRIDES this when set.
structure_inference_gpu_model: ""
# Optional length-based GPU routing by VRAM (within this partition). List your GPU
# pool as tiers of {min_vram_gb, nodes}; a complex's estimated peak VRAM
# (~ structure_inference_ram_per_token_sq * N^2) selects the smallest tier that fits
# and all SMALLER-GPU nodes are excluded, so the job runs on ANY GPU >= that tier
# (the whole pool, not one pinned model). A complex larger than every tier uses the
# biggest tier and spills to host RAM via unified memory. When set, this drives
# --exclude and OVERRIDES structure_inference_gpu_model. Use explicit comma node lists
# (avoid bracket ranges, which the shell may glob). The example below is for the EMBL
# gpu-el8 partition - replace nodes with your cluster's; nothing is hard-coded.
# structure_inference_gpu_vram_headroom: 1.0   # <1.0 tolerates that fraction of host spill
# structure_inference_gpu_tiers:
#   - {min_vram_gb: 16, nodes: "gpu60,gpu61,gpu62,gpu63,gpu64,gpu65,gpu66,gpu67,gpu68"}  # RTX PRO 4500 Blackwell, 16GB MIG slices
#   - {min_vram_gb: 24, nodes: "gpu21,gpu22,gpu29,gpu30,gpu31,gpu32,gpu33,gpu34,gpu35,gpu36,gpu37"}  # RTX 3090
#   - {min_vram_gb: 40, nodes: "gpu25,gpu26,gpu27,gpu28"}                                # A100 40GB
#   - {min_vram_gb: 48, nodes: "gpu40,gpu41,gpu42,gpu43,gpu44,gpu45,gpu46,gpu47,gpu48"}  # L40s/A40 48GB
#   - {min_vram_gb: 80, nodes: "gpu38,gpu39"}                                            # H100 PCIe 80GB
#   - {min_vram_gb: 96, nodes: "gpu50,gpu51,gpu52,gpu53"}                                # RTX PRO 6000 Blackwell 96GB
# Blackwell (compute capability 12.0 / sm_120): RTX PRO 6000 (gpu50-53, 96GB) and
# RTX PRO 4500 (gpu60-68, sliced into 16GB MIG instances) are verified working with
# AlphaPulldown 2.5.0 containers - AF3 (jax 0.9.1/ptxas 12.9/cuDNN 9.17/Tokamax, all
# three attention implementations) and AF2 (jax 0.5.3 on ptxas 12.9/cuDNN 9.2x), with
# confidence scores matching A100/H100/3090. Only PRE-2.5.0 images fail there, at the
# first kernel compilation with "ptxas too old" / UNIMPLEMENTED; that is an image
# problem, so exclude those nodes only while you are still on an old image.
# The 16GB MIG slices suit monomers and small complexes; send bigger jobs to the
# 96GB RTX PRO 6000 cards via the tiers above. A plain "gpu:1" gres lands on a MIG
# slice correctly (SLURM sets CUDA_VISIBLE_DEVICES=MIG-...), so no gres change is
# needed to use them.
# H100-SXM/H200/B200 live on the separate gpu-training partition (not routed here).
# Optional: comma-separated nodes to keep structure_inference OFF, passed to sbatch
# as --exclude. Useful as a fallback for GPUs the prediction container cannot use
# (e.g. a CUDA compute capability the bundled ptxas is too old for - which for
# Blackwell means a pre-2.5.0 image; see the note above). Example:
# slurm_exclude_nodes: "gpu50,gpu51,gpu52,gpu53"
# slurm_exclude_nodes: ""
# Cap structure_inference wall time (minutes) so retry scaling (1440 * attempt) cannot
# exceed the partition MaxTime and trigger "Requested time limit is invalid" failures.
structure_inference_max_runtime: 10080
# Enable JAX/XLA unified (managed) memory for structure inference so large complexes
# spill from GPU VRAM into host RAM instead of OOM-ing (DeepMind-recommended for large
# AlphaFold 3 inputs; slower when actually spilling). On by default.
structure_inference_unified_memory: true
# How far past physical GPU VRAM XLA may allocate. "auto" (default) computes it per
# job at run time as (allocated host RAM) / (physical GPU VRAM), so the unified-memory
# ceiling stays within the SLURM --mem allocation and XLA cannot oversubscribe host
# RAM beyond what the job requested. Set a number (e.g. 3.2) to pin it explicitly.
structure_inference_xla_mem_fraction: auto

# Specify the backend by changing the prediction container
# - "docker://kosinskilab/alphafold2:2.7.0" for AlphaFold2
#   (ships a patched HHblits 3.3.1 - stock 3.3.0 aborts long queries with
#    "MergeMasterSlave: did not find N match states", see hh-suite#389 - and
#    fixes a crash on templates whose sum_probs is unset)
# - "docker://kosinskilab/alphafold3:2.7.0" for AlphaFold3
#   (reads/writes compressed *_af3_input.json.xz features)
# - "docker://kosinskilab/alphalink:2.1.5" for AlphaLink  (latest published alphalink tag)
# (you can also use local singularity .sif files)
# - "/path/to/my/container.sif"
prediction_container: "docker://kosinskilab/alphafold3:2.7.0"

# Container for structure analysis. alphajudge publishes only ":latest".
analysis_container: "docker://kosinskilab/alphajudge:latest"
