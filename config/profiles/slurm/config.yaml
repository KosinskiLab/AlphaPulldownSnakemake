executor: slurm

default-resources:
  - mem_mb=8000
  - runtime=60

#set-resources:
#  - structure_inference:slurm_partition=gpu
#  - structure_inference:slurm_gres=gpu:1
#  - structure_inference:gpus_per_task=1

use-singularity: true

# Share built .sif images across working directories. Without this Snakemake
# stores them in <workdir>/.snakemake/singularity, so every new deployment
# re-pulls the same multi-GB containers. $VARS and ~ are expanded by Snakemake.
# Must be on a filesystem visible from the compute nodes.
apptainer-prefix: "$HOME/.apptainer/snakemake-images"

# forward the binds/NV flags your Snakefile computes
envvars:
  - APPTAINER_BINDPATH
  - SINGULARITY_BINDPATH
  - APPTAINER_NV
  - SINGULARITY_NV


printshellcmds: true
rerun-incomplete: true
keep-going: true
# The memory model sizes the first attempt and escalates on OOM via
# `..._ram_scaling ** (attempt - 1)`. That escalation only happens if retries are
# enabled - without this, an OOM is a permanent loss and the model has to over-request
# for every job to cover a thin tail.
retries: 3
rerun-triggers: mtime
latency-wait: 600
slurm-logdir: "slurm-logs"
slurm-delete-logfiles-older-than: 0 # do not delete old log files
